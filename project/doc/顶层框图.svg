<rect x="40" y="680" width="1720" height="250" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="1.4" stroke-dasharray="8 5"/>
<text x="62" y="714" font-size="15" font-weight="700" fill="#8d6e00">核心架构约束：写只在开机，读只在运行期</text>
<text x="62" y="746" font-size="12.2" fill="#5d4037">原因：显示读与帧写入并发时，加密 SDRAM 控制器会丢写命令 → 某些地址保持旧内容（静态横带，每次上电位置不同）。</text>
<text x="62" y="776" font-size="12.2" fill="#5d4037">做法：上电预载 4 张图（display_valid=0，不读帧缓存）；预载完成后才允许读，运行期永不写。</text>
<text x="62" y="806" font-size="12.2" fill="#5d4037">效果：切换瞬间完成、无加载提示、无撕裂、无横带；K14/K15/K16 等调试逻辑已从综合中移除。</text>
<text x="62" y="856" font-size="12" fill="#5d4037">M1 补丁：Setup +0.174ns / Hold +0.019ns（0 失败端点） · LUT 3,994 (20.38%) · REG 3,896 · BRAM9K 18/64 · DSP 0/29</text>
<text x="62" y="884" font-size="12" fill="#5d4037">bit：project/out/main_project_m1_patch.bit　·　tag：m1-patch（基线 m1-final）　·　M2 起叠加行缓冲/转场/OSD</text>
